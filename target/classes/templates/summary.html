<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Articles RSS</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Articles disponibles</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>GUID (lien)</th>
            </tr>
        </thead>
<tbody>
<tr th:each="article : ${articles}" style="cursor: pointer;">
    <!-- Make the ID cell clickable -->
    <td th:onclick="'window.location.href=\'/rss25SB/resume/html/' + ${article.id} + '\''" th:text="${article.id}"></td>
    <!-- Make the date cell clickable -->
    <td th:onclick="'window.location.href=\'/rss25SB/resume/html/' + ${article.id} + '\''" th:text="${article.date}"></td>
    <td>
        <!-- URL column remains separate with external linking behavior -->
        <a th:href="${#strings.startsWith(article.guid, 'http') ? article.guid : 'https://' + article.guid}" 
           th:text="${article.guid}" 
           target="_blank" 
           rel="noopener noreferrer"></a>
    </td>
</tr>
</tbody>

    </table>
</body>
</html>
